<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEM Viewer — Step 1 MVP</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: sans-serif; }
  #app { width: 100%; height: 100%; }
  #hud {
    position: fixed; left: 8px; top: 8px; z-index: 10;
    background: rgba(255,255,255,0.92); padding: 8px 10px; border-radius: 6px;
    font-size: 12px; line-height: 1.5; max-width: 340px;
  }
  #hud .err { color: #a00; }
  #attr {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: rgba(255,255,255,0.85); padding: 3px 10px;
    font-size: 11px; color: #333; text-align: center;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div id="hud">loading…</div>
<div id="attr">Copernicus DEM (EGM2008, surface model) · Copernicus Sentinel-2 imagery · © OpenStreetMap contributors (ODbL)</div>
<script type="module" src="./main.js?v=10"></script>
</body>
</html>
